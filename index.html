<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corvette Concept</title>
<style>
  :root { --bg:#05070c; --panel:rgba(14,20,30,.82); --line:#2a3a52; --ink:#cfe0f5; --dim:#7f93ad; --accent:#4fb3ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #ui { position:fixed; top:16px; left:16px; width:236px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; backdrop-filter:blur(6px); }
  #ui h1 { font-size:14px; margin:0 0 2px; letter-spacing:.08em; text-transform:uppercase; }
  #ui .sub { color:var(--dim); font-size:11px; margin-bottom:12px; }
  .row { display:flex; gap:6px; margin-bottom:8px; }
  button { flex:1; background:#13202f; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 6px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { background:#16405f; border-color:var(--accent); color:#fff; }
  label { display:block; color:var(--dim); font-size:11px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  #hud { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 14px; font-size:12px; letter-spacing:.04em; color:var(--ink); white-space:nowrap; }
  #help { position:fixed; bottom:14px; left:16px; color:var(--dim); font-size:11px; }
  #stats { position:fixed; top:16px; right:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:11px; color:var(--dim); line-height:1.6; }
  #stats b { color:var(--ink); font-weight:600; }
  @media (max-width:600px){ #ui{ width:auto; right:16px; } #stats{ display:none; } }
</style>
</head>
<body>
<div id="ui">
  <h1>Corvette Concept</h1>
  <div class="sub">80 m · v6 battle run · original design</div>
  <div class="row"><button id="bDeploy">Deploy turrets</button></div>
  <div class="row"><button id="bCombat">Combat mode</button></div>
  <div class="row"><button id="bSpin" class="on">Auto-rotate</button><button id="bWire">Wireframe</button></div>
  <div class="row"><button id="bDetail" class="on">Surface detail</button><button id="bScale">Scale ref</button></div>
  <div class="row"><button id="bCraft">Launch craft</button><button id="bReset">Reset view</button></div>
  <div class="row"><button id="bBattle">▶ Battle run</button><button id="bCam">Cam: Chase</button></div>
  <label>Throttle &nbsp;<span style="opacity:.7">◀ reverse · forward ▶</span></label><input id="throttle" type="range" min="-1" max="1" step="0.01" value="0.55">
</div>
<div id="stats">
  Length <b>80 m</b><br>Beam <b id="beam">–</b><br>Span <b id="span">–</b><br>
  Turrets <b>6</b> (2 dorsal · 2 ventral · 2 wing)<br>State <b id="state">Stowed</b>
</div>
<div id="help">Drag to orbit · Right-drag / two-finger to pan · Scroll / pinch to zoom</div>
<div id="hud"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const R = (a,b) => a + Math.random()*(b-a);
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = x => { x = clamp01(x); return x*x*(3-2*x); };
const randDir = () => { const u=Math.random()*2-1, a=Math.random()*Math.PI*2, r=Math.sqrt(1-u*u); return new THREE.Vector3(r*Math.cos(a), u, r*Math.sin(a)); };

// =====================================================================
// Renderer, scene, lighting
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.5, 14000);
const sky = new THREE.Group(); scene.add(sky);       // follows the camera: stars, nebulae, planet

scene.add(new THREE.HemisphereLight(0x9fb8d8, 0x2a2a30, 0.35));
const sun = new THREE.DirectionalLight(0xfff1dd, 1.75); sun.position.set(60, 90, 45);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-62, right:62, top:62, bottom:-62, near:10, far:300 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0x5aa0ff, 1.0); rim.position.set(-70, -20, -60); scene.add(rim);

// Environment map for metal reflections: a gradient sky with a warm key panel and a cool rim panel
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  const g = new THREE.SphereGeometry(50, 32, 16), p = g.attributes.position, col = [];
  const hz = new THREE.Color(0x1a2433), up = new THREE.Color(0x4f6585), dn = new THREE.Color(0x040506);
  for (let i=0;i<p.count;i++){ const y = p.getY(i)/50; const c = y > 0 ? hz.clone().lerp(up, y) : hz.clone().lerp(dn, -y); col.push(c.r,c.g,c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  env.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide })));
  const panel = (pos, c, s) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s,s), new THREE.MeshBasicMaterial({ color:c, side:THREE.DoubleSide })); m.position.copy(pos); m.lookAt(0,0,0); env.add(m); };
  panel(new THREE.Vector3(28,38,20), new THREE.Color(6,5.5,4.8), 18);
  panel(new THREE.Vector3(-34,-8,-30), new THREE.Color(0.7,1.5,3.2), 22);
  scene.environment = pmrem.fromScene(env, 0.03).texture;
}

// starfield
{
  const n = 3500, p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const v = randDir().multiplyScalar(9000+Math.random()*2500); p.set([v.x,v.y,v.z], i*3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p,3));
  const st = new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:1.5, sizeAttenuation:false, depthWrite:false })); st.renderOrder = -5; sky.add(st);
}

// =====================================================================
// Procedural textures
// =====================================================================
const mkCanvas = (w, h=w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// Hull plating: recursive plate subdivision -> colour map + matching bump map (recessed panel lines)
// One seeded layout of plates + wear, rendered into several passes (colour per paint, bump, roughness) so every
// paint variant chips, streaks and scorches in exactly the same places and the bump/roughness maps line up.
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TS = 1024;
const LAYOUT = (() => {
  const rnd = mulberry32(80808), Rr = (a,b) => a + rnd()*(b-a), snap = v => Math.round(v/32)*32, plates = [];
  (function split(px,py,pw,ph,d){
    if (d >= 5 || (pw <= 96 && ph <= 96) || (d >= 2 && rnd() < 0.22)) { plates.push({ x:px, y:py, w:pw, h:ph }); return; }
    const vert = pw > ph*1.3 ? true : ph > pw*1.3 ? false : rnd() < 0.5;
    const len = vert ? pw : ph, sp = snap(len*Rr(0.3,0.7));
    if (sp < 32 || sp > len-32) { plates.push({ x:px, y:py, w:pw, h:ph }); return; }
    if (vert) { split(px,py,sp,ph,d+1); split(px+sp,py,pw-sp,ph,d+1); } else { split(px,py,pw,sp,d+1); split(px,py+sp,pw,ph-sp,d+1); }
  })(0,0,TS,TS,0);
  const STENCILS = ['NO STEP','A-12','4B','VENT','CAUTION','P-07','ACCESS','SVC 3','HV','N2','DANGER','09','17-C','FWD ▶','▲ LIFT','GND','CO2','B-4','EVA ⊕'];
  const chips = [], stencils = [];
  plates.forEach(p => {
    p.tint = (rnd()-0.5)*0.14; p.b = 116 + (rnd()*32|0); p.rv = (rnd()-0.5)*40;
    const r = rnd();
    if (r < 0.18 && p.w >= 96 && p.h >= 64) { const hw = Math.min(p.w-32, Rr(40,90)), hh = Math.min(p.h-32, Rr(30,60)); p.hatch = [p.x+Rr(16,p.w-hw-16), p.y+Rr(16,p.h-hh-16), hw, hh]; }
    else if (r < 0.32 && p.w >= 64 && p.h >= 64) p.vent = [p.x+16, p.y+Rr(12,p.h-40), 6+(rnd()*6|0), Math.min(p.w-32, 96)];
    else if (r < 0.40) p.bar = [p.x+8, p.y+p.h-18, Math.min(p.w-16,120), rnd() < 0.5];
    p.rivets = rnd() < 0.35;
    if (rnd() < 0.13 && p.w > 80 && p.h > 40) stencils.push({ x:p.x+Rr(10,p.w-70), y:p.y+Rr(18,p.h-8), t:STENCILS[rnd()*STENCILS.length|0], s:Rr(9,14), y2:rnd()<0.3 });
    // edge chipping: concentrated on exposed edges and corners
    const edges = [[p.x,p.y,p.x+p.w,p.y],[p.x+p.w,p.y,p.x+p.w,p.y+p.h],[p.x,p.y+p.h,p.x+p.w,p.y+p.h],[p.x,p.y,p.x,p.y+p.h]];
    edges.forEach(([x1,y1,x2,y2]) => { const L = Math.hypot(x2-x1,y2-y1), n = Math.floor(L/26*Rr(0.2,1.4));
      for (let i=0;i<n;i++){ const t = rnd(), cx = x1+(x2-x1)*t + Rr(-4,4), cy = y1+(y2-y1)*t + Rr(-4,4), rr = Rr(1.5,6), k = 5+(rnd()*4|0), pts = [];
        for (let j=0;j<k;j++){ const a = j/k*Math.PI*2, q = rr*Rr(0.45,1.25); pts.push([cx+Math.cos(a)*q, cy+Math.sin(a)*q*Rr(0.5,1)]); }
        chips.push({ cx, cy, r:rr*1.4, pts }); } });
    if (rnd() < 0.3) for (const [cx,cy] of [[p.x,p.y],[p.x+p.w,p.y+p.h]]) { const k = 7, pts = [], rr = Rr(4,10); for (let j=0;j<k;j++){ const a=j/k*Math.PI*2, q=rr*Rr(0.4,1.2); pts.push([cx+Math.cos(a)*q, cy+Math.sin(a)*q]); } chips.push({ cx, cy, r:rr*1.3, pts }); }
  });
  const scratches = Array.from({length:140}, () => { const x = rnd()*TS, y = rnd()*TS, a = rnd()*Math.PI, l = Rr(6,45); return { x, y, x2:x+Math.cos(a)*l, y2:y+Math.sin(a)*l, al:Rr(0.05,0.18), r:l }; });
  const streaks = Array.from({length:220}, () => ({ x:rnd()*TS, y:rnd()*TS, len:Rr(40,300), w:Rr(2,12), a:Rr(0.06,0.2) }));
  const blotches = Array.from({length:70}, () => ({ x:rnd()*TS, y:rnd()*TS, r:Rr(30,160), a:Rr(0.04,0.12), light:rnd()<0.35 }));
  const scorch = Array.from({length:3}, () => ({ x:rnd()*TS, y:rnd()*TS, r:Rr(30,90), parts:Array.from({length:24}, () => [Rr(-1,1), Rr(-1,1), Rr(0.2,0.6)]) }));
  const pits = Array.from({length:1800}, () => [rnd()*TS, rnd()*TS, rnd()]);
  return { plates, chips, scratches, streaks, blotches, scorch, pits, stencils };
})();
function renderWear(mode, base){
  const c = mkCanvas(TS), x = c.getContext('2d'), L = LAYOUT, S = TS;
  const wrap = (cx,cy,r,fn) => { for (const ox of [-S,0,S]) for (const oy of [-S,0,S]) { if (cx+ox+r < 0 || cx+ox-r > S || cy+oy+r < 0 || cy+oy-r > S) continue; fn(ox,oy); } };
  const C = mode === 'color', B = mode === 'bump', RG = mode === 'rough';
  x.fillStyle = C ? base : B ? '#888' : '#8c8c8c'; x.fillRect(0,0,S,S);
  // plates
  for (const p of L.plates) {
    if (C) { x.fillStyle = p.tint > 0 ? `rgba(255,255,255,${p.tint})` : `rgba(0,0,0,${-p.tint})`; x.fillRect(p.x,p.y,p.w,p.h); }
    if (B) { x.fillStyle = `rgb(${p.b},${p.b},${p.b})`; x.fillRect(p.x,p.y,p.w,p.h); }
    if (RG) { const v = 140 + p.rv | 0; x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(p.x,p.y,p.w,p.h); }
    if (p.hatch && !RG) { const [hx,hy,hw,hh] = p.hatch; x.lineWidth = 2; x.strokeStyle = C ? 'rgba(20,24,30,.6)' : '#2a2a2a'; x.strokeRect(hx,hy,hw,hh);
      if (C) { x.fillStyle = 'rgba(20,24,30,.55)'; [[hx+5,hy+5],[hx+hw-5,hy+5],[hx+5,hy+hh-5],[hx+hw-5,hy+hh-5]].forEach(([a,b]) => x.fillRect(a-1.5,b-1.5,3,3)); x.fillStyle = 'rgba(217,165,33,.55)'; x.fillRect(hx+hw-14, hy+4, 8, 4); } }
    if (p.vent) { const [gx,gy,n,gw] = p.vent; x.fillStyle = C ? 'rgba(15,18,22,.7)' : B ? '#151515' : '#d0d0d0'; for (let i=0;i<n && i*8<gw;i++) x.fillRect(gx+i*8,gy,4,24);
      if (C) { const g = x.createLinearGradient(0,gy+24,0,gy+90); g.addColorStop(0,'rgba(25,22,20,.28)'); g.addColorStop(1,'rgba(25,22,20,0)'); x.fillStyle = g; x.fillRect(gx-2, gy+24, Math.min(n*8,gw)+2, 66); } }
    if (p.bar && C) { x.fillStyle = p.bar[3] ? 'rgba(217,165,33,.6)' : 'rgba(230,233,238,.5)'; x.fillRect(p.bar[0], p.bar[1], p.bar[2], 6); }
    if (p.rivets && !RG) { x.fillStyle = C ? 'rgba(30,34,40,.45)' : '#5a5a5a'; for (let i=p.x+8;i<p.x+p.w-4;i+=12){ x.fillRect(i,p.y+5,2,2); x.fillRect(i,p.y+p.h-7,2,2); } }
  }
  // fading / grime blotches
  for (const b of L.blotches) wrap(b.x,b.y,b.r,(ox,oy) => {
    const g = x.createRadialGradient(b.x+ox,b.y+oy,0,b.x+ox,b.y+oy,b.r);
    const col = C ? (b.light ? `rgba(255,250,240,${b.a})` : `rgba(28,24,20,${b.a})`) : B ? `rgba(128,128,128,0)` : (b.light ? `rgba(90,90,90,${b.a*2})` : `rgba(230,230,230,${b.a*3})`);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(b.x+ox-b.r,b.y+oy-b.r,b.r*2,b.r*2); });
  // grime streaks running aft (canvas y = ship axis)
  for (const st of L.streaks) wrap(st.x, st.y+st.len/2, st.len, (ox,oy) => {
    const g = x.createLinearGradient(0, st.y+oy, 0, st.y+oy+st.len);
    const col = a => C ? `rgba(34,30,26,${a})` : RG ? `rgba(225,225,225,${a*2})` : `rgba(100,100,100,${a*0.4})`;
    g.addColorStop(0, col(0)); g.addColorStop(0.12, col(st.a)); g.addColorStop(1, col(0)); x.fillStyle = g; x.fillRect(st.x+ox-st.w/2, st.y+oy, st.w, st.len); });
  // panel lines with grime settled into them
  if (C) { x.save(); x.shadowColor = 'rgba(22,20,18,.55)'; x.shadowBlur = 7; x.strokeStyle = 'rgba(30,30,30,.25)'; x.lineWidth = 3; for (const p of L.plates) x.strokeRect(p.x,p.y,p.w,p.h); x.restore(); }
  x.strokeStyle = C ? 'rgba(18,22,28,.8)' : B ? '#000' : '#e0e0e0'; x.lineWidth = C ? 2.5 : B ? 4 : 5;
  for (const p of L.plates) x.strokeRect(p.x,p.y,p.w,p.h);
  // edge chips: primer rim + bare metal; slightly recessed, smoother than paint
  for (const ch of L.chips) wrap(ch.cx, ch.cy, ch.r, (ox,oy) => {
    const path = () => { x.beginPath(); ch.pts.forEach(([a,b],i) => i ? x.lineTo(a+ox,b+oy) : x.moveTo(a+ox,b+oy)); x.closePath(); };
    if (C) { x.save(); x.translate(ch.cx+ox, ch.cy+oy); x.scale(1.3,1.3); x.translate(-ch.cx-ox, -ch.cy-oy); path(); x.fillStyle = 'rgba(70,74,80,.75)'; x.fill(); x.restore(); path(); x.fillStyle = 'rgba(168,174,182,.95)'; x.fill(); }
    else { path(); x.fillStyle = B ? '#6a6a6a' : '#4a4a4a'; x.fill(); } });
  // scratches
  x.lineCap = 'round';
  for (const sc of L.scratches) wrap((sc.x+sc.x2)/2, (sc.y+sc.y2)/2, sc.r, (ox,oy) => {
    x.strokeStyle = C ? `rgba(175,182,190,${sc.al})` : B ? `rgba(80,80,80,${sc.al})` : `rgba(80,80,80,${sc.al})`; x.lineWidth = 1;
    x.beginPath(); x.moveTo(sc.x+ox, sc.y+oy); x.lineTo(sc.x2+ox, sc.y2+oy); x.stroke(); });
  // carbon scoring
  for (const sc of L.scorch) wrap(sc.x, sc.y, sc.r*1.6, (ox,oy) => sc.parts.forEach(([dx,dy,a]) => {
    const cx = sc.x+ox+dx*sc.r, cy = sc.y+oy+dy*sc.r, rr = sc.r*0.6, g = x.createRadialGradient(cx,cy,0,cx,cy,rr);
    g.addColorStop(0, C ? `rgba(14,12,10,${a*0.3})` : RG ? `rgba(240,240,240,${a*0.5})` : 'rgba(128,128,128,0)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(cx-rr,cy-rr,rr*2,rr*2); }));
  // micro-meteorite pitting
  for (const [px,py,v] of L.pits) { x.fillStyle = C ? `rgba(20,20,20,${0.06+v*0.14})` : B ? '#707070' : '#a8a8a8'; x.fillRect(px,py,v<0.9?1:2,v<0.9?1:2); }
  // small stencilled markings (colour only)
  if (C) for (const st of L.stencils) { x.font = `bold ${st.s}px "Helvetica Neue", Arial, sans-serif`; x.fillStyle = st.y2 ? 'rgba(217,165,33,.8)' : 'rgba(20,26,34,.6)'; x.fillText(st.t, st.x, st.y); }
  return c;
}
const canvasTex = (c, srgb) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (srgb) t.encoding = THREE.sRGBEncoding; return t; };
const WEAR_BUMP = canvasTex(renderWear('bump')), WEAR_ROUGH = canvasTex(renderWear('rough'));
const paintMat = (base, extra={}) => new THREE.MeshStandardMaterial(Object.assign({ map:canvasTex(renderWear('color', base), true), bumpMap:WEAR_BUMP, bumpScale:0.55, roughnessMap:WEAR_ROUGH, roughness:1.0, metalness:.42, flatShading:true }, extra));
// Bay door: grey panel with hazard-striped border
function doorTexture(){
  const S = 256, c = mkCanvas(S), x = c.getContext('2d');
  x.fillStyle = '#1d2026'; x.fillRect(0,0,S,S);
  x.save(); x.beginPath(); x.rect(0,0,S,S); x.rect(22,22,S-44,S-44); x.clip('evenodd');
  x.fillStyle = '#d9a521'; for (let i=-S;i<S*2;i+=28){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+14,0); x.lineTo(i+14-S,S); x.lineTo(i-S,S); x.fill(); }
  x.restore();
  x.fillStyle = '#8b949f'; x.fillRect(22,22,S-44,S-44);
  x.strokeStyle = 'rgba(30,36,46,.7)'; x.lineWidth = 3; x.strokeRect(40,40,S-80,S-80); x.strokeRect(70,90,S-140,S-180);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
// Soft radial glow for lights, engines and muzzle flashes
const glowTex = (() => { const S = 128, c = mkCanvas(S), x = c.getContext('2d'), g = x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.2,'rgba(255,255,255,.55)'); g.addColorStop(0.5,'rgba(255,255,255,.12)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,S,S); return new THREE.CanvasTexture(c); })();
const plumeTex = (() => { const c = mkCanvas(4,128), x = c.getContext('2d'), g = x.createLinearGradient(0,128,0,0);
  g.addColorStop(0,'#fff'); g.addColorStop(0.2,'#888'); g.addColorStop(1,'#000'); x.fillStyle = g; x.fillRect(0,0,4,128); return new THREE.CanvasTexture(c); })();
// Hull markings (transparent canvas decals)
function textTexture(w, h, draw, wear=1){ const c = mkCanvas(w,h), x = c.getContext('2d'); draw(x, w, h);
  if (wear) { x.globalCompositeOperation = 'destination-out'; const n = w*h/700*wear; for (let i=0;i<n;i++){ x.fillStyle = `rgba(0,0,0,${0.25+Math.random()*0.75})`; x.beginPath(); x.arc(Math.random()*w, Math.random()*h, 0.5+Math.random()*2.5, 0, 7); x.fill(); }

// =====================================================================
// Hull definition: lofted hard-edged sections
// =====================================================================
// z (+ forward), half-width, top, bottom
const ST = [
  [ 40.0, 3.0, 1.5,-1.3],   // blunt nose face
  [ 38.5, 3.6, 2.1,-1.8],
  [ 30.0, 6.0, 3.0,-2.5],
  [ 16.0, 9.2, 3.9,-3.1],
  [  0.0,12.4, 4.5,-3.5],
  [-16.0,14.8, 4.8,-3.7],
  [-30.0,15.6, 4.7,-3.6],
  [-37.0,15.0, 4.3,-3.3],
  [-39.5,13.8, 3.8,-3.0],
];
function lerpSt(z, k){
  for (let i=0;i<ST.length-1;i++){ const a=ST[i], b=ST[i+1];
    if (z<=a[0] && z>=b[0]){ const t=(a[0]-z)/(a[0]-b[0]); return a[k]+(b[k]-a[k])*t; } }
  return z>0 ? ST[0][k] : ST[ST.length-1][k];
}
const W = z => lerpSt(z,1), TOP = z => lerpSt(z,2), BOT = z => lerpSt(z,3);
const chineY = z => { const t = TOP(z), b = BOT(z); return b + (t-b)*0.42; };
const BEAM = 2*Math.max(...ST.map(s=>s[1]));

// hexagonal section: flat deck, knife-edge waist chine, flat belly (counter-clockwise from the front)
function section(w, top, bot){
  const h = top-bot, cy = bot + h*0.42, tw = w*0.5, bw = w*0.62;
  return [[ tw, top],[-tw, top],[-w, cy+h*0.04],[-w, cy-h*0.04],[-bw, bot],[ bw, bot],[ w, cy-h*0.04],[ w, cy+h*0.04]];
}
// the two flank faces as parametric strips: t=0 at deck/chine edge, returns point + outward normal (starboard side)
function faceUpper(z, t){ const w=W(z), tp=TOP(z), b=BOT(z), h=tp-b, cy=b+h*0.42; const A=[w*0.5,tp], B=[w,cy+h*0.04]; return pt(A,B,t); }
function faceLower(z, t){ const w=W(z), tp=TOP(z), b=BOT(z), h=tp-b, cy=b+h*0.42; const A=[w,cy-h*0.04], B=[w*0.62,b]; return pt(A,B,t); }
function pt(A,B,t){ const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy); return { p:[A[0]+dx*t, A[1]+dy*t], n:[-dy/L, dx/L], len:L }; }
const mir = pts => pts.map(([x,y]) => [-x,y]).reverse();
// all ST stations strictly between za and zb so lofted add-ons stay flush with the piecewise hull
const zsBetween = (za, zb) => [za, ...ST.map(s=>s[0]).filter(z => z < za && z > zb), zb];

function loftPts(stations, mat, capMat = M.dark){
  const n = stations[0].pts.length, pos = [], uv = [], idx = [];
  stations.forEach(s => {
    let per = 0; const L = [0];
    for (let k=0;k<n;k++){ const a=s.pts[k], b=s.pts[(k+1)%n]; per += Math.hypot(a[0]-b[0], a[1]-b[1]); L.push(per); }
    for (let k=0;k<=n;k++){ const p = s.pts[k%n]; pos.push(p[0], p[1], s.z); uv.push(L[k]/16, s.z/16); }
  });
  const Rn = n+1;
  for (let i=0;i<stations.length-1;i++) for (let k=0;k<n;k++){ const a=i*Rn+k, b=a+1, c=a+Rn, d=c+1; idx.push(a,c,b, b,c,d); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  const grp = new THREE.Group(); grp.add(new THREE.Mesh(g, mat));
  if (capMat) [[stations[0], false], [stations[stations.length-1], true]].forEach(([s, flip]) => {
    const m = new THREE.Mesh(scaleUV(new THREE.ShapeGeometry(new THREE.Shape(s.pts.map(p => new THREE.Vector2(p[0],p[1])))), 1/16), capMat);
    m.position.z = s.z; if (flip) m.rotation.y = Math.PI; grp.add(m);
  });
  return grp;
}
const loft = (st, mat, capMat) => loftPts(st.map(s => ({ z:s[0], pts:section(s[1],s[2],s[3]) })), mat, capMat);

// Craft cradle: a stepped recess shaped to the landing craft — shallow wing ledge (HW wide, D1 deep) and a deeper
// fuselage trough (FW wide, D2 deep). Vertical end walls come from doubled stations at HZ0 / HZ1.
const HZ0 = -5.0, HZ1 = -16.0, HW = 4.1, FW = 1.5, D1 = 0.35, D2 = 0.6, HD = D2;
function hullSection(z, on){
  const w=W(z), top=TOP(z), bot=BOT(z), h=top-bot, cy=bot+h*0.42, tw=w*0.5, bw=w*0.62, a = on ? D1 : 0, b = on ? D2 : 0;
  return [[tw,top],[HW,top],[HW,top-a],[FW,top-a],[FW,top-b],[-FW,top-b],[-FW,top-a],[-HW,top-a],[-HW,top],[-tw,top],
          [-w,cy+h*0.04],[-w,cy-h*0.04],[-bw,bot],[bw,bot],[w,cy-h*0.04],[w,cy+h*0.04]];
}
{
  const zs = ST.map(s=>s[0]), st = [];
  zs.filter(z => z > HZ0).forEach(z => st.push({ z, pts:hullSection(z,0) }));
  st.push({ z:HZ0, pts:hullSection(HZ0,0) }, { z:HZ0, pts:hullSection(HZ0,HD) });
  zs.filter(z => z < HZ0 && z > HZ1).forEach(z => st.push({ z, pts:hullSection(z,HD) }));
  st.push({ z:HZ1, pts:hullSection(HZ1,HD) }, { z:HZ1, pts:hullSection(HZ1,0) });
  zs.filter(z => z < HZ1).forEach(z => st.push({ z, pts:hullSection(z,0) }));
  ship.add(loftPts(st, M.hull, null));
  [[ST[0], false], [ST[ST.length-1], true]].forEach(([s, flip]) => {
    const m = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(section(s[1],s[2],s[3]).map(p => new THREE.Vector2(p[0],p[1])))), M.dark);
    m.position.z = s[0]; if (flip) m.rotation.y = Math.PI; ship.add(m);
  });
}
// dorsal spine ridge + ventral keel
const spineSt = z => [z, Math.min(2.4, 0.8+W(z)*0.1), TOP(z)+1.0, TOP(z)-0.2];
ship.add(loft(zsBetween(38.5, HZ0).map(spineSt), M.navy, M.navyS));
ship.add(loft(zsBetween(HZ1, -37).map(spineSt), M.navy, M.navyS));
ship.add(loft(ST.slice(2,8).map(s=>[s[0], Math.min(2.0, 0.6+s[1]*0.09), s[3]+0.2, s[3]-0.9]), M.gun, M.dark));
// accent trim along the waist chine
for (const sx of [-1,1]) {
  const st = zsBetween(38.5, -37).map(z => { const y = chineY(z), x = W(z)+0.12; const p = [[x+0.22,y+0.28],[x-0.3,y+0.36],[x-0.3,y-0.36],[x+0.22,y-0.28]]; return { z, pts: sx<0 ? mir(p) : p }; });
  ship.add(loftPts(st, M.accent, M.accent));
}

// =====================================================================
// Armour plating: raised, segmented plates on deck, flanks and belly
// =====================================================================
const TH = 0.22;                               // plate thickness
const BAYW = 3.8;                              // turret bay size
const BAYS = [ {x:-3.9, z:4,   top:true}, {x:4.2, z:-20, top:true, rest:Math.PI}, {x:3.9, z:6, top:false}, {x:-4.2, z:-24, top:false} ];
function cutRanges(ranges, cuts){
  return cuts.reduce((rs, [c0, c1]) => rs.flatMap(([a,b]) => (c1 >= a || c0 <= b) ? [[a,b]] : [[a,c0],[c1,b]].filter(([p,q]) => p-q > 1.2)), ranges);
}
const baysFor = (sx, top, m) => BAYS.filter(b => b.top === top && Math.sign(b.x) === sx).map(b => [b.z+BAYW/2+m, b.z-BAYW/2-m]);
function segments(breaks, cuts=[]){
  const r = []; for (let i=0;i<breaks.length-1;i++) r.push([breaks[i]-0.25, breaks[i+1]+0.25]);
  return cutRanges(r, cuts);
}
const deckPlates = [], bellyPlates = [], upperPlates = [], lowerPlates = [];
const DECK_BREAKS  = [22, 16.5, 10.5, 3.5, -3.5, -10.5, -17.5, -24.5, -31.5, -38.8];
const BELLY_BREAKS = [30, 23.5, 16.5, 10.5, 3.5, -3.5, -10.5, -17.5, -24.5, -31.5, -38.8];
const SIDE_BREAKS  = [37.2, 31, 24.5, 17.5, 10.5, 3.5, -3.5, -10.5, -17.5, -24.5, -31.5, -38.8];
for (const sx of [-1,1]) {
  // deck plates between spine channel and deck edge
  const deckPlate = (za, zb, xi) => {
    const xo = z => W(z)*0.5 - 0.3;
    const st = zsBetween(za,zb).map(z => { const t = TOP(z); const p = [[xo(z)-0.15,t+TH],[xi+0.15,t+TH],[xi,t-0.05],[xo(z),t-0.05]]; return { z, pts: sx<0 ? mir(p) : p }; });
    detail.add(loftPts(st, M.plate, M.plate)); deckPlates.push({ sx, za, zb, xi, xo });
  };
  for (const [za,zb] of segments(DECK_BREAKS, [...baysFor(sx, true, 0.4), [HZ0+0.3, HZ1-0.3]])) deckPlate(za, zb, 2.6);
  for (const [za,zb] of [[HZ0+0.25, -10.25], [-10.75, HZ1-0.25]]) deckPlate(za, zb, HW+0.75);   // outboard of the cradle   // narrow plates outboard of the hangar
  // belly plates between keel and belly edge
  for (const [za,zb] of segments(BELLY_BREAKS, baysFor(sx, false, 0.4))) {
    const xi = 2.4, xo = z => W(z)*0.62 - 0.3;
    const st = zsBetween(za,zb).map(z => { const b = BOT(z); const p = [[xo(z),b+0.05],[xi,b+0.05],[xi+0.15,b-TH],[xo(z)-0.15,b-TH]]; return { z, pts: sx<0 ? mir(p) : p }; });
    detail.add(loftPts(st, M.gun, M.gun)); bellyPlates.push({ sx, za, zb, xi, xo });
  }
  // flank plates (upper and lower faces)
  const flank = (face, za, zb, t0, t1, th=TH) => zsBetween(za,zb).map(z => {
    const a = face(z,t0), b = face(z,t1), n = a.n, dx = b.p[0]-a.p[0], dy = b.p[1]-a.p[1], L = Math.hypot(dx,dy), ux = dx/L*0.12, uy = dy/L*0.12;
    const p = [[b.p[0],b.p[1]],[b.p[0]+n[0]*th-ux, b.p[1]+n[1]*th-uy],[a.p[0]+n[0]*th+ux, a.p[1]+n[1]*th+uy],[a.p[0],a.p[1]]];
    return { z, pts: sx<0 ? mir(p) : p };
  });
  for (const [za,zb] of segments(SIDE_BREAKS)) {
    const um = za > 32 ? M.navy : M.plate;            // navy nose cap
    detail.add(loftPts(flank(faceUpper, za, zb, 0.1, 0.8), um, um)); upperPlates.push({ sx, za, zb, t0:0.1, t1:0.8 });
    if (za < 36) { detail.add(loftPts(flank(faceLower, za, zb, 0.12, 0.85), M.navy, M.navy)); lowerPlates.push({ sx, za, zb, t0:0.12, t1:0.85 }); }
  }
  // red pinstripe just above the waist chine, full length
  ship.add(loftPts(flank(faceUpper, 37.5, -38.5, 0.86, 0.93, 0.1), M.redP, M.redP));
}

// orientation helper for anything sitting on a flank face: x = along section, y = outward normal, z = ship axis
const tmpM = new THREE.Matrix4();
function flankFrame(face, z, t, sx, lift){
  const f = face(z, t), n = new THREE.Vector3(sx*f.n[0], f.n[1], 0);
  const xA = new THREE.Vector3(n.y, -n.x, 0), zA = new THREE.Vector3(0,0,1);
  const q = new THREE.Quaternion().setFromRotationMatrix(tmpM.makeBasis(xA, n, zA));
  const pos = new THREE.Vector3(sx*f.p[0], f.p[1], z).addScaledVector(n, lift);
  return { pos, q, n };
}
// a quad strip laid onto a flank face between z=za..zb and t0..t1, lifted along the face normal
function flankStrip(face, za, zb, t0, t1, sx, lift, mat, segs=10){
  const pos = [], uv = [], idx = [];
  for (let i=0;i<=segs;i++){ const z = za + (zb-za)*i/segs;
    for (const [t, v] of [[t0,1],[t1,0]]) { const f = face(z,t); pos.push(sx*(f.p[0]+f.n[0]*lift), f.p[1]+f.n[1]*lift, z); uv.push(sx>0 ? i/segs : 1-i/segs, v); } }
  for (let i=0;i<segs;i++){ const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  // orient triangles so the front face points outward
  const P = k => new THREE.Vector3(pos[k*3], pos[k*3+1], pos[k*3+2]);
  const nrm = new THREE.Vector3().subVectors(P(1),P(0)).cross(new THREE.Vector3().subVectors(P(2),P(0)));
  const f0 = face(za,(t0+t1)/2), out = new THREE.Vector3(sx*f0.n[0], f0.n[1], 0);
  if (nrm.dot(out) < 0) for (let k=0;k<idx.length;k+=3){ const t = idx[k+1]; idx[k+1] = idx[k+2]; idx[k+2] = t; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function greebleCluster(pl, yOf, dir){

      const z = cz + R(-1.8,1.8), xo = Math.min(pl.xo(z-l/2), pl.xo(z+l/2)), ax = pl.xi + 0.25 + w/2 + cf*(xo - pl.xi - 0.5 - w) + R(-0.8,0.8);

function battleStep(dt){

  const f = pathFrame(B.u);
  const prev = rig.position.clone();
  rig.position.copy(f.p);
  if (B.first) { B.vel.copy(f.t).multiplyScalar(B.speed); B.first = false; B.prevT.copy(f.t); }

  const yawRate = new THREE.Vector3().crossVectors(B.prevT, f.t).y / Math.max(dt, 1e-3); B.prevT.copy(f.t);
  B.bank += (THREE.MathUtils.clamp(-yawRate*1.4, -0.6, 0.6) - B.bank)*Math.min(1, dt*1.5);

  list.forEach((r, i) => { q.setFromAxisAngle(r.axis, r.spd*tt).multiply(r.q0); sc.copy(r.stretch).multiplyScalar(r.size); rocks.setMatrixAt(i, m.compose(r.pos, q, sc)); });

  farFlash.forEach(s => { if (s.material.opacity > 0) s.material.opacity = Math.max(0, s.material.opacity - dt*2.5);

}

function setBattle(on){
  B.on = on; world.visible = on; battleSky.visible = on; dust.visible = on; shield.visible = on;
  $('hud').style.display = on ? 'block' : 'none'; $('help').style.display = on ? 'none' : 'block';
  $('bBattle').textContent = on ? '■ End run' : '▶ Battle run'; tog($('bBattle'), on);
  bolts.slice().forEach(b => scene.remove(b)); bolts.length = 0;
  if (on) {
    combat = false; target.visible = false; tog($('bCombat'), false);
    deployed = true; tog($('bDeploy'), true); spin = false; tog($('bSpin'), false);
    $('throttle').value = 0.8; B.u = 0; B.first = true; B.kills = 0; B.hits = 0; B.cine = 0; B.cineT = 6.5; B.fly = null;
    Object.assign(ctl, { theta:Math.PI*0.88, phi:1.22, r:105 }); ctl.target.set(0,0,0);
    enemies.forEach(e => { e.alive = true; e.g.visible = true; e.first = true; }); allies.forEach(a => { a.first = true; a.tgt = null; });
    rig.getWorldPosition(rigPos);
  } else {
    rig.position.set(0,0,0); rig.quaternion.identity(); camera.up.set(0,1,0);
    Object.assign(ctl, DEFAULT); ctl.target.set(0,0,0); deployed = false; tog($('bDeploy'), false); $('throttle').value = 0.55;
  }
}
$('bBattle').onclick = () => setBattle(!B.on);
$('bCam').onclick = () => { B.cam = B.cam === 'chase' ? 'cinematic' : 'chase'; $('bCam').textContent = 'Cam: ' + (B.cam === 'chase' ? 'Chase' : 'Cinematic'); B.cineT = 6.5; B.fly = null; };
addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') $('bCam').onclick();
  if (e.key === 'h' || e.key === 'H') ['ui','stats'].forEach(id => $(id).style.display = $(id).style.display === 'none' ? '' : 'none'); });

// =====================================================================
// Animation
// =====================================================================
const clock = new THREE.Clock();
const tmp = new THREE.Vector3(), tWorld = new THREE.Vector3();
function stepTurret(t, dt){
  // deploy: pedestal raises the head by t.raise (half the old travel); stowed it rests on the mount ring, barrels exposed
  const goal = deployed ? 1 : 0;
  t.deploy += Math.sign(goal - t.deploy) * Math.min(Math.abs(goal - t.deploy), dt*0.6);
  const lp = smooth(t.deploy/0.7);
  t.lift.position.y = t.seat - t.raise + lp*t.raise;
  let wantYaw = t.rest, wantPitch = 0;
  t.canFire = false;
  const tp = t.deploy > 0.98 ? turretTarget(t) : null;
  if (tp) {
    tWorld.copy(tp);
    tmp.copy(tWorld); t.lift.worldToLocal(tmp); tmp.y -= t.raise + 1.05;
    const elev = Math.atan2(tmp.y, Math.hypot(tmp.x, tmp.z));
    t.canFire = elev > -0.12;
    wantYaw = Math.atan2(tmp.x, tmp.z);
    wantPitch = -Math.max(-0.1, Math.min(1.45, elev));
  }
  const dy = Math.atan2(Math.sin(wantYaw - t.aimYaw), Math.cos(wantYaw - t.aimYaw));
  t.aimYaw += Math.sign(dy)*Math.min(Math.abs(dy), dt*1.8);
  const pr = 1.4;
  t.aimPitch += Math.sign(wantPitch - t.aimPitch)*Math.min(Math.abs(wantPitch - t.aimPitch), dt*pr);
  t.yaw.rotation.y = t.aimYaw; t.pitch.rotation.x = t.aimPitch;

  t.muzzles.forEach(m => m.fl.material.opacity = Math.max(0, m.fl.material.opacity - dt*8));
  t.cool -= dt;
  if (t.canFire && Math.abs(dy) < 0.08 && t.cool <= 0) {
    t.cool = 0.35 + Math.random()*0.25;
    t.muzzles.forEach(({ m, fl }) => {
      fl.material.opacity = 1;
      const from = m.getWorldPosition(new THREE.Vector3());
      const dir = tWorld.clone().sub(from).normalize().add(randDir().multiplyScalar(0.012)).normalize();
      if (B.on) fireBolt('ally', from, dir.multiplyScalar(750).add(B.vel), 1.4);
      else { const b = new THREE.Mesh(boltG, M.bolt); b.position.copy(from); b.lookAt(from.clone().add(dir)); b.userData = { v: dir.multiplyScalar(220), life: 1.2, team:'drone' }; scene.add(b); bolts.push(b); }
    });
  }
}
let tt = 0;
const glowCol = new THREE.Color(), SUN_OFF = new THREE.Vector3(60, 90, 45);
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); tt += dt;
  if (B.on) battleStep(dt); else { if (spin) ctl.theta += dt*0.12; updateCam(); rig.getWorldPosition(rigPos); }
  sky.position.copy(camera.position);
  ship.position.y = Math.sin(tt*0.6)*0.4; ship.rotation.z = Math.sin(tt*0.4)*0.015;
  sun.position.copy(rigPos).add(SUN_OFF); sun.target.position.copy(rigPos); sun.target.updateMatrixWorld();

  // engines
  const thr = +$('throttle').value;
  engineFX.forEach(e => {
    const th = e.rev ? Math.max(0, -thr) : Math.max(0, thr);
    glowCol.setHSL(0.57, 0.9, 0.3 + th*0.45);
    const flick = 0.92 + Math.random()*0.08, len = e.r*(1.5 + th*6.5*flick);
    e.disc.material.color.copy(glowCol).multiplyScalar(0.4 + th*0.8);
    e.plume.visible = th > 0.02; e.plume.scale.set(0.8+th*0.3, len, 0.8+th*0.3); e.plume.position.z = e.exit - len/2;
    e.plume.material.opacity = 0.25 + th*0.5;
    e.spr.scale.setScalar(e.r*(1.5 + th*3.5)*flick); e.spr.material.opacity = (e.rev ? 0 : 0.2) + th*0.8;
  });
  // RCS: occasional attitude-correction puffs
  if (Math.random() < dt*1.6) { const r = rcs[Math.random()*rcs.length|0]; r.puff.material.opacity = 1; }
  rcs.forEach(r => { const o = r.puff.material.opacity; if (o > 0) { r.puff.material.opacity = Math.max(0, o - dt*3.5); r.puff.scale.setScalar(1.0 + (1-o)*1.6); r.puff.position.copy(r.base).addScaledVector(r.dv, (1-o)*0.9); } });
  // landing craft: lift out of the recess, retract skids, climb to a hover station ahead of the bridge
  {
    const u = craft.userData, goal = craftOut ? 1 : 0;
    u.k += Math.sign(goal - u.k) * Math.min(Math.abs(goal - u.k), dt*0.22);
    const a = smooth((u.k-0.08)/0.3), b = smooth((u.k-0.38)/0.62), hover = smooth((u.k-0.95)/0.05);
    craft.position.set(0, u.baseY + a*4.6 + b*7 + hover*Math.sin(tt*1.3)*0.3, u.baseZ + b*26);
    craft.rotation.set(HSLOPE*(1-a) - Math.sin(b*Math.PI)*0.12, 0, hover*Math.sin(tt*0.9)*0.05);
    clamps.forEach(c => c.rotation.x = -1.1*smooth(u.k/0.08));
    const g = u.k > 0.01 ? 0.45 + 0.55*a : 0;
    craftFX.forEach(f => { f.disc.material.color.setHSL(0.57, 0.9, 0.2 + g*0.5); f.spr.material.opacity = g; f.spr.scale.setScalar(1.2 + g*1.6); });
  }
  blinkers.forEach(b => b.m.visible = ((tt + b.phase) % b.period) < b.on);

  if (combat) {
    const a = tt*0.35;
    target.position.set(Math.sin(a)*85, Math.sin(a*2)*35 + Math.cos(a*0.7)*15, Math.cos(a)*60);
    target.rotation.x += dt; target.rotation.y += dt*1.3;
  }
  turrets.forEach(t => stepTurret(t, dt));
  const st = turrets[0].deploy;
  $('state').textContent = B.on ? 'Battle run' : combat ? 'Engaging' : st > 0.99 ? 'Deployed' : st < 0.01 ? 'Stowed' : (deployed ? 'Deploying…' : 'Stowing…');

  for (let i = bolts.length-1; i >= 0; i--) {
    const b = bolts[i], u = b.userData; b.position.addScaledVector(u.v, dt); u.life -= dt;
    if (u.team === 'drone') {
      if (target.visible && b.position.distanceTo(target.position) < 3.5) {
        const f = glowSprite(0xffc070, 6); f.position.copy(b.position); f.userData.life = 0.3; scene.add(f); flashes.push(f); u.life = 0; }
    } else if (u.team === 'ally' || u.team === 'wing') {
      for (const e of enemies) if (e.alive && b.position.distanceToSquared(e.pos) < 60) {
        if (u.team === 'ally' || Math.random() < 0.35) killEnemy(e, u.team === 'ally'); else boom(b.position, 2.5, 0x9fe0ff, 0xffc070);
        u.life = 0; break; }
    } else if (u.team === 'enemy') {
      tmp.copy(b.position); ship.worldToLocal(tmp);
      const ex = tmp.x/SH.x, ey = tmp.y/SH.y, ez = (tmp.z+1)/SH.z;
      if (ex*ex + ey*ey + ez*ez < 1) { shieldMat.uniforms.uHit.value.set(ex, ey, ez).normalize(); shieldMat.uniforms.uHitT.value = 1;
        boom(b.position, 3, 0x9fe0ff, 0x6cc4ff); B.hits++; u.life = 0; }
    } else if (u.life <= 0 && u.aim) boom(u.aim, R(18,34));
    if (u.life <= 0) { scene.remove(b); bolts.splice(i,1); }
  }
  stepFx(dt);
  for (let i = flashes.length-1; i >= 0; i--) { const f = flashes[i]; f.userData.life -= dt; f.scale.setScalar(6 + (0.3-f.userData.life)*40); f.material.opacity = Math.max(0, f.userData.life/0.3);
    if (f.userData.life <= 0) { scene.remove(f); f.material.dispose(); flashes.splice(i,1); } }

  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
updateCam(); animate();
window.__dbg = { turrets, ctl, detail, craft, launch: () => $('bCraft').onclick(), B, setBattle, enemies };
})();
</script>
</body>
